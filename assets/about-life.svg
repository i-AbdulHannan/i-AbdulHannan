<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="360" viewBox="0 0 1000 360"><defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9ff3a"/><stop offset="1" stop-color="#0245ec"/></linearGradient>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#0245ec" opacity=".18"/></pattern>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}.title{font-weight:900;letter-spacing:-2px}.label{font-size:11px;letter-spacing:2px;font-weight:700}.anim{animation:fadeUp .8s both}@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.anim{animation:none!important}.smil{display:none}}</style></defs><rect width="1000" height="360" rx="26" fill="#fff"/><rect width="1000" height="360" rx="26" fill="url(#dots)"/><rect x="1" y="1" width="998" height="358" rx="25" fill="none" stroke="url(#edge)" stroke-width="2"/>
<text x="38" y="52" class="label" fill="#0245ec">ABOUT / LIFE</text><text x="38" y="100" font-size="42" class="title" fill="#000">I build useful things.</text><text x="40" y="145" font-size="16" fill="#333">Full-stack web development</text><text x="40" y="176" font-size="16" fill="#333">WordPress development</text><text x="40" y="207" font-size="16" fill="#333">AI integrations &amp; scripting</text><text x="40" y="238" font-size="16" fill="#333">Practical tools for messy workflows</text>
<rect x="525" y="30" width="435" height="300" rx="22" fill="#080808"/><text x="558" y="70" class="label" fill="#d9ff3a">OFF THE CLOCK</text>
<g class="smil"><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.3;.34;.96;1" dur="12s" repeatCount="indefinite"/><text x="558" y="140" font-size="36" font-weight="800" fill="#fff">Poetry &amp; words</text><text x="558" y="177" font-size="16" fill="#ddd">Reading and writing poetry.</text></g><g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.32;.36;.63;.67" dur="12s" repeatCount="indefinite"/><text x="558" y="140" font-size="36" font-weight="800" fill="#fff">Novel reader</text><text x="558" y="177" font-size="16" fill="#ddd">Stories, ideas, new worlds.</text></g><g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.65;.69;.96;1" dur="12s" repeatCount="indefinite"/><text x="558" y="140" font-size="36" font-weight="800" fill="#fff">Cricket</text><text x="558" y="177" font-size="16" fill="#ddd">A little competition and joy.</text></g></g>
<g fill="#d9ff3a"><rect x="558" y="250" width="112" height="4" rx="2"><animate attributeName="width" values="0;112" dur="4s" repeatCount="indefinite"/></rect><rect x="678" y="250" width="112" height="4" rx="2" opacity=".35"/><rect x="798" y="250" width="112" height="4" rx="2" opacity=".35"/></g></svg>