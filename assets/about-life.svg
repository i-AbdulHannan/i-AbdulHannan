<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
<defs>
  <linearGradient id="edgeAbout" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#d9ff3a"/><stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <pattern id="dotsAbout" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".14"/>
  </pattern>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .title{font-weight:900;letter-spacing:-2px}
    .label{font-size:11px;letter-spacing:2px;font-weight:700}
    @media(prefers-reduced-motion:reduce){.carousel{display:none!important}.static{display:block!important}}
  </style>
</defs>

<rect width="1000" height="360" rx="26" fill="#0245ec"/>
<rect width="1000" height="360" rx="26" fill="url(#dotsAbout)"/>
<rect x="1" y="1" width="998" height="358" rx="25" fill="none" stroke="url(#edgeAbout)" stroke-width="2"/>

<text x="38" y="52" class="label" fill="#d9ff3a">ABOUT / LIFE</text>
<text x="38" y="100" font-size="42" class="title" fill="#ffffff">I build useful things.</text>
<text x="40" y="145" font-size="16" fill="#ffffff">Full-stack web development</text>
<text x="40" y="176" font-size="16" fill="#ffffff">WordPress development</text>
<text x="40" y="207" font-size="16" fill="#ffffff">AI integrations &amp; scripting</text>
<text x="40" y="238" font-size="16" fill="#ffffff">Practical tools for messy workflows</text>

<rect x="525" y="30" width="435" height="300" rx="22" fill="#000000" stroke="#d9ff3a" stroke-width="1"/>
<text x="558" y="70" class="label" fill="#d9ff3a">OFF THE CLOCK</text>

<!-- Only ONE slide is visible at a time. Discrete opacity prevents text stacking. -->
<g class="carousel">
  <rect x="548" y="92" width="389" height="125" rx="16" fill="#000000"/>
  <text x="575" y="142" font-size="31" font-weight="800" fill="#ffffff">Poetry &amp; words</text>
  <text x="575" y="176" font-size="15" fill="#d7d7d7">Reading and writing poetry.</text>
  <animate attributeName="opacity" calcMode="discrete"
    values="1;1;0;0;1" keyTimes="0;.30;.34;.96;1" dur="12s" repeatCount="indefinite"/>
</g>

<g class="carousel">
  <rect x="548" y="92" width="389" height="125" rx="16" fill="#000000"/>
  <text x="575" y="142" font-size="31" font-weight="800" fill="#ffffff">Novel reader</text>
  <text x="575" y="176" font-size="15" fill="#d7d7d7">Reading novels and discovering new worlds.</text>
  <animate attributeName="opacity" calcMode="discrete"
    values="0;0;1;1;0" keyTimes="0;.30;.34;.63;.67" dur="12s" repeatCount="indefinite"/>
</g>

<g class="carousel">
  <rect x="548" y="92" width="389" height="125" rx="16" fill="#000000"/>
  <text x="575" y="142" font-size="31" font-weight="800" fill="#ffffff">Cricket</text>
  <text x="575" y="176" font-size="15" fill="#d7d7d7">A little competition and a lot of fun.</text>
  <animate attributeName="opacity" calcMode="discrete"
    values="0;0;1;1;0" keyTimes="0;.63;.67;.96;1" dur="12s" repeatCount="indefinite"/>
</g>

<!-- three 4-second progress segments -->
<rect x="558" y="250" width="112" height="5" rx="2.5" fill="#ffffff" opacity=".22"/>
<rect x="678" y="250" width="112" height="5" rx="2.5" fill="#ffffff" opacity=".22"/>
<rect x="798" y="250" width="112" height="5" rx="2.5" fill="#ffffff" opacity=".22"/>
<rect x="558" y="250" width="112" height="5" rx="2.5" fill="#d9ff3a">
  <animate attributeName="x" calcMode="discrete"
    values="558;678;798;558" keyTimes="0;.333;.666;1" dur="12s" repeatCount="indefinite"/>
</rect>
<text x="558" y="292" class="label" fill="#ffffff" opacity=".55">3 INTERESTS · 4 SEC / SLIDE</text>

<!-- static fallback -->
<g class="static" display="none">
  <text x="575" y="142" font-size="31" font-weight="800" fill="#ffffff">Poetry &amp; words</text>
  <text x="575" y="176" font-size="15" fill="#d7d7d7">Reading and writing poetry.</text>
</g>
</svg>